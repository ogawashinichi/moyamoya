<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 ページが見つかりません — 新聞記者のもやもや話</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>if(localStorage.getItem('theme')==='newspaper')document.documentElement.setAttribute('data-theme','newspaper');</script>
  <link rel="stylesheet" href="style.css">
  <style>
    .not-found-wrap {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1rem;
    }
    .not-found-num {
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 900;
      line-height: 1;
      color: var(--pop-pink);
      letter-spacing: -4px;
    }
    .not-found-title {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 1rem 0 0.5rem;
    }
    .not-found-desc {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 2rem;
    }
    .not-found-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--pop-pink);
      color: #fff;
      font-weight: 700;
      padding: 0.65rem 1.6rem;
      border-radius: var(--radius);
      text-decoration: none;
      font-size: 1rem;
      transition: opacity 0.15s;
    }
    .not-found-btn:hover { opacity: 0.85; }
    .not-found-mic {
      font-size: 4rem;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="/" class="logo" aria-label="トップページへ">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3zm7 9a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 11z"/>
            </svg>
          </div>
          <div>
            <div class="logo-name">新聞記者のもやもや話</div>
          </div>
        </a>
        <nav class="site-nav">
          <a href="/" class="nav-link">アーカイブ</a>
          <button class="btn-theme-toggle" id="btn-theme-toggle" aria-label="テーマ切替" title="テーマ切替">📰</button>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <div class="not-found-wrap">
      <div class="not-found-mic">🎙️</div>
      <div class="not-found-num">404</div>
      <h1 class="not-found-title">ページが見つかりません</h1>
      <p class="not-found-desc">お探しのページは削除されたか、URLが間違っている可能性があります。</p>
      <a href="/" class="not-found-btn">← トップページへ戻る</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>新聞記者のもやもや話 — X Spaces Archive</p>
    </div>
  </footer>

  <script>
    const themeToggle = document.getElementById('btn-theme-toggle');
    if (themeToggle) {
      const isNewspaper = () => document.documentElement.getAttribute('data-theme') === 'newspaper';
      themeToggle.textContent = isNewspaper() ? '🎨' : '📰';
      themeToggle.addEventListener('click', () => {
        if (isNewspaper()) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('theme', 'default');
          themeToggle.textContent = '📰';
        } else {
          document.documentElement.setAttribute('data-theme', 'newspaper');
          localStorage.setItem('theme', 'newspaper');
          themeToggle.textContent = '🎨';
        }
      });
    }
  </script>
</body>
</html>
