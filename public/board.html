<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>掲示板 — 新聞記者のもやもや話</title>
  <meta name="description" content="リスナーから寄せられた感想・テーマリクエストの掲示板です。">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FF5E89">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>if(localStorage.getItem('theme')==='newspaper')document.documentElement.setAttribute('data-theme','newspaper');</script>
  <link rel="stylesheet" href="style.css">
  <style>
    .board-section { padding: 48px 0 80px; }
    .board-lead { color: var(--muted); margin-bottom: 32px; line-height: 1.7; }
    .board-list { display: flex; flex-direction: column; gap: 16px; }
    .board-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px 24px;
    }
    .board-card-meta {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 10px; flex-wrap: wrap;
    }
    .board-card-name { font-weight: 700; color: var(--text); }
    .board-card-date { font-size: 0.82rem; color: var(--muted); }
    .board-card-body { color: var(--text); line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
    .board-empty { text-align: center; color: var(--muted); padding: 60px 0; }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="/" class="logo" aria-label="トップページへ">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3zm7 9a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 11z"/>
            </svg>
          </div>
          <div>
            <div class="logo-name">新聞記者のもやもや話</div>
          </div>
        </a>
        <nav class="site-nav">
          <a href="/" class="nav-link">アーカイブ</a>
          <a href="/board.html" class="nav-link active">掲示板</a>
          <button class="btn-theme-toggle" id="btn-theme-toggle" aria-label="テーマ切替" title="テーマ切替">📰</button>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="board-section">
      <div class="container">
        <div class="section-header">
          <h2 class="section-title">
            <span class="section-title-bar"></span>リスナーの声
          </h2>
        </div>
        <p class="board-lead">寄せられた感想・テーマリクエストの中から、許可をいただいたものを掲載しています。</p>
        <div class="board-list" id="board-list">
          <div class="state-loading"><div class="spinner"></div><p>読み込み中…</p></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>新聞記者のもやもや話 — X Spaces Archive &nbsp;|&nbsp;
        <a href="/admin.html">管理画面</a>
      </p>
    </div>
  </footer>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <script src="board.js"></script>
</body>
</html>
