<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スケジュール管理 — 新聞記者のもやもや話</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FF5E89">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;700;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>if(localStorage.getItem('theme')==='newspaper')document.documentElement.setAttribute('data-theme','newspaper');</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="/" class="logo">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3zm7 9a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 11z"/>
            </svg>
          </div>
          <div><div class="logo-name">新聞記者のもやもや話</div></div>
        </a>
        <nav class="site-nav">
          <a href="/admin.html" class="nav-link">管理画面</a>
          <button class="btn-theme-toggle" id="btn-theme-toggle" aria-label="テーマ切替" title="テーマ切替">📰</button>
          <button class="btn-logout" id="btn-logout">ログアウト</button>
        </nav>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">

      <div class="admin-page-header">
        <div>
          <div class="admin-breadcrumb"><a href="/admin.html">管理画面</a> › スケジュール管理</div>
          <h1>スケジュール管理</h1>
          <p>今後の収録・配信予定を登録できます。公開するとトップページに表示されます。</p>
        </div>
      </div>

      <div class="admin-nav-tabs">
        <a href="/admin.html" class="admin-nav-tab">📋 エピソード管理</a>
        <a href="/schedule.html" class="admin-nav-tab active">📅 スケジュール</a>
        <a href="/settings.html" class="admin-nav-tab">⚙️ サイト設定</a>
        <a href="/profiles.html" class="admin-nav-tab">👤 話者プロフィール</a>
        <a href="/messages.html" class="admin-nav-tab" id="nav-messages">💬 メッセージ</a>
      </div>

      <div class="admin-grid">
        <!-- Register Form -->
        <div class="admin-card">
          <h2>新規スケジュールを追加</h2>
          <form id="schedule-form" novalidate>
            <div class="form-group">
              <label for="s-date">日付<span class="required">*</span></label>
              <input type="date" id="s-date" required>
            </div>
            <div class="form-group">
              <label for="s-time">時刻（任意）</label>
              <input type="time" id="s-time" placeholder="例：21:00">
            </div>
            <div class="form-group">
              <label for="s-title">タイトル<span class="required">*</span></label>
              <input type="text" id="s-title" required maxlength="200" placeholder="例：第○回収録予定">
            </div>
            <div class="form-group">
              <label for="s-desc">説明（任意）</label>
              <textarea id="s-desc" rows="3" placeholder="テーマや詳細など"></textarea>
            </div>
            <div class="form-group">
              <label for="s-url">関連URL（任意）</label>
              <input type="url" id="s-url" placeholder="https://x.com/i/spaces/…">
            </div>
            <div class="form-group form-group--check">
              <label class="check-label">
                <input type="checkbox" id="s-published">
                <span>すぐに公開する</span>
              </label>
            </div>
            <button type="submit" class="btn-submit" id="s-submit">追加する</button>
          </form>
        </div>

        <!-- Schedule List -->
        <div class="admin-card">
          <h2>登録済みスケジュール</h2>
          <div id="schedule-list" class="recent-list">
            <p style="color:var(--muted);font-size:14px;">読み込み中…</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>新聞記者のもやもや話 — X Spaces Archive &nbsp;|&nbsp; <a href="/">アーカイブ一覧に戻る</a></p>
    </div>
  </footer>

  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">スケジュールを編集</h3>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <div class="form-group">
        <label for="e-date">日付<span class="required">*</span></label>
        <input type="date" id="e-date" required>
      </div>
      <div class="form-group">
        <label for="e-time">時刻（任意）</label>
        <input type="time" id="e-time">
      </div>
      <div class="form-group">
        <label for="e-title">タイトル<span class="required">*</span></label>
        <input type="text" id="e-title" required maxlength="200">
      </div>
      <div class="form-group">
        <label for="e-desc">説明（任意）</label>
        <textarea id="e-desc" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label for="e-url">関連URL（任意）</label>
        <input type="url" id="e-url" placeholder="https://…">
      </div>
      <div class="form-group form-group--check">
        <label class="check-label">
          <input type="checkbox" id="e-published">
          <span>公開する</span>
        </label>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="modal-cancel">キャンセル</button>
        <button class="btn-save" id="modal-save">保存する</button>
      </div>
    </div>
  </div>

  <script src="schedule.js"></script>
</body>
</html>
